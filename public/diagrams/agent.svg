<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">受控 Agent 的工具执行边界</title><desc id="desc">任务与身份：限定目标、用户及预算 → 计划与选择：只提供允许调用的工具 → 参数与权限：结构校验及资源授权 → 审批与执行：读写分离、幂等及确认 → 结果与状态：审计、超时及人工接管 → 结束与复核：步数上限及结果验证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#eef5f8"/><path d="M0 0 H1000 V132 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" fill="#fff" font-size="32" font-weight="700">受控 Agent 的工具执行边界</text><text x="48" y="98" fill="#b6d9e3" font-size="19">每次写操作在服务端重新授权</text><path d="M328 230 H350" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 230 H662" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M812 290 V360" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M672 430 H650" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 430 H338" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="48" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="200" fill="#087e8b" font-size="15">STEP 01</text><text x="68" y="235" fill="#102d40" font-size="23" font-weight="600">任务与身份</text><text x="68" y="266" fill="#4f6473" font-size="16">限定目标、用户及预算</text></g><g><rect x="360" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="200" fill="#087e8b" font-size="15">STEP 02</text><text x="380" y="235" fill="#102d40" font-size="23" font-weight="600">计划与选择</text><text x="380" y="266" fill="#4f6473" font-size="16">只提供允许调用的工具</text></g><g><rect x="672" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="200" fill="#087e8b" font-size="15">STEP 03</text><text x="692" y="235" fill="#102d40" font-size="23" font-weight="600">参数与权限</text><text x="692" y="266" fill="#4f6473" font-size="16">结构校验及资源授权</text></g><g><rect x="672" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="400" fill="#087e8b" font-size="15">STEP 04</text><text x="692" y="435" fill="#102d40" font-size="23" font-weight="600">审批与执行</text><text x="692" y="466" fill="#4f6473" font-size="16">读写分离、幂等及确认</text></g><g><rect x="360" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="400" fill="#087e8b" font-size="15">STEP 05</text><text x="380" y="435" fill="#102d40" font-size="23" font-weight="600">结果与状态</text><text x="380" y="466" fill="#4f6473" font-size="16">审计、超时及人工接管</text></g><g><rect x="48" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="400" fill="#087e8b" font-size="15">STEP 06</text><text x="68" y="435" fill="#102d40" font-size="23" font-weight="600">结束与复核</text><text x="68" y="466" fill="#4f6473" font-size="16">步数上限及结果验证</text></g><text x="48" y="540" fill="#536d7c" font-size="14">来源：fde.loyo.work</text></g></svg>