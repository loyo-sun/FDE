<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">从客户诉求到可验证问题</title><desc id="desc">访谈取证：最近一次任务与例外 → 流程还原：参与人、等待及交接 → 问题陈述：用户、障碍与影响 → 场景筛选：价值、可行性及风险 → 指标基线：样本、分母与观察窗口 → 范围共识：纳入、排除与验收人</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#eef5f8"/><path d="M0 0 H1000 V132 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" fill="#fff" font-size="32" font-weight="700">从客户诉求到可验证问题</text><text x="48" y="98" fill="#b6d9e3" font-size="19">先收集事实，再决定范围与成功标准</text><path d="M328 230 H350" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 230 H662" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M812 290 V360" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M672 430 H650" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 430 H338" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="48" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="200" fill="#087e8b" font-size="15">STEP 01</text><text x="68" y="235" fill="#102d40" font-size="23" font-weight="600">访谈取证</text><text x="68" y="266" fill="#4f6473" font-size="16">最近一次任务与例外</text></g><g><rect x="360" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="200" fill="#087e8b" font-size="15">STEP 02</text><text x="380" y="235" fill="#102d40" font-size="23" font-weight="600">流程还原</text><text x="380" y="266" fill="#4f6473" font-size="16">参与人、等待及交接</text></g><g><rect x="672" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="200" fill="#087e8b" font-size="15">STEP 03</text><text x="692" y="235" fill="#102d40" font-size="23" font-weight="600">问题陈述</text><text x="692" y="266" fill="#4f6473" font-size="16">用户、障碍与影响</text></g><g><rect x="672" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="400" fill="#087e8b" font-size="15">STEP 04</text><text x="692" y="435" fill="#102d40" font-size="23" font-weight="600">场景筛选</text><text x="692" y="466" fill="#4f6473" font-size="16">价值、可行性及风险</text></g><g><rect x="360" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="400" fill="#087e8b" font-size="15">STEP 05</text><text x="380" y="435" fill="#102d40" font-size="23" font-weight="600">指标基线</text><text x="380" y="466" fill="#4f6473" font-size="16">样本、分母与观察窗口</text></g><g><rect x="48" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="400" fill="#087e8b" font-size="15">STEP 06</text><text x="68" y="435" fill="#102d40" font-size="23" font-weight="600">范围共识</text><text x="68" y="466" fill="#4f6473" font-size="16">纳入、排除与验收人</text></g><text x="48" y="540" fill="#536d7c" font-size="14">来源：fde.loyo.work</text></g></svg>