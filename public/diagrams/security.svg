<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">沿数据与动作边界设置控制</title><desc id="desc">身份边界：用户、服务及租户 → 数据入口：分类、用途及最小收集 → 检索边界：权限过滤及缓存隔离 → 模型边界：不可信内容与输出校验 → 动作边界：工具白名单及人工批准 → 审计与删除：证据、保留及撤销验证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#eef5f8"/><path d="M0 0 H1000 V132 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" fill="#fff" font-size="32" font-weight="700">沿数据与动作边界设置控制</text><text x="48" y="98" fill="#b6d9e3" font-size="19">模型输出不能替代服务端授权</text><path d="M328 230 H350" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 230 H662" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M812 290 V360" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M672 430 H650" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 430 H338" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="48" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="200" fill="#087e8b" font-size="15">STEP 01</text><text x="68" y="235" fill="#102d40" font-size="23" font-weight="600">身份边界</text><text x="68" y="266" fill="#4f6473" font-size="16">用户、服务及租户</text></g><g><rect x="360" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="200" fill="#087e8b" font-size="15">STEP 02</text><text x="380" y="235" fill="#102d40" font-size="23" font-weight="600">数据入口</text><text x="380" y="266" fill="#4f6473" font-size="16">分类、用途及最小收集</text></g><g><rect x="672" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="200" fill="#087e8b" font-size="15">STEP 03</text><text x="692" y="235" fill="#102d40" font-size="23" font-weight="600">检索边界</text><text x="692" y="266" fill="#4f6473" font-size="16">权限过滤及缓存隔离</text></g><g><rect x="672" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="400" fill="#087e8b" font-size="15">STEP 04</text><text x="692" y="435" fill="#102d40" font-size="23" font-weight="600">模型边界</text><text x="692" y="466" fill="#4f6473" font-size="16">不可信内容与输出校验</text></g><g><rect x="360" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="400" fill="#087e8b" font-size="15">STEP 05</text><text x="380" y="435" fill="#102d40" font-size="23" font-weight="600">动作边界</text><text x="380" y="466" fill="#4f6473" font-size="16">工具白名单及人工批准</text></g><g><rect x="48" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="400" fill="#087e8b" font-size="15">STEP 06</text><text x="68" y="435" fill="#102d40" font-size="23" font-weight="600">审计与删除</text><text x="68" y="466" fill="#4f6473" font-size="16">证据、保留及撤销验证</text></g><text x="48" y="540" fill="#536d7c" font-size="14">来源：fde.loyo.work</text></g></svg>