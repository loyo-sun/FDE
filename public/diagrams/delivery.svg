<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">从启动到可移交的交付门禁</title><desc id="desc">启动与范围：角色、指标及依赖 → 方案与原型：契约、架构及风险 → 实施与联调：版本、配置及测试 → 试运行：分组观察及故障演练 → 验收：冻结样本及签署结论 → 移交：值班、恢复及遗留事项</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#eef5f8"/><path d="M0 0 H1000 V132 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" fill="#fff" font-size="32" font-weight="700">从启动到可移交的交付门禁</text><text x="48" y="98" fill="#b6d9e3" font-size="19">每个阶段以证据结束，而非以会议结束</text><path d="M328 230 H350" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 230 H662" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M812 290 V360" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M672 430 H650" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 430 H338" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="48" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="200" fill="#087e8b" font-size="15">STEP 01</text><text x="68" y="235" fill="#102d40" font-size="23" font-weight="600">启动与范围</text><text x="68" y="266" fill="#4f6473" font-size="16">角色、指标及依赖</text></g><g><rect x="360" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="200" fill="#087e8b" font-size="15">STEP 02</text><text x="380" y="235" fill="#102d40" font-size="23" font-weight="600">方案与原型</text><text x="380" y="266" fill="#4f6473" font-size="16">契约、架构及风险</text></g><g><rect x="672" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="200" fill="#087e8b" font-size="15">STEP 03</text><text x="692" y="235" fill="#102d40" font-size="23" font-weight="600">实施与联调</text><text x="692" y="266" fill="#4f6473" font-size="16">版本、配置及测试</text></g><g><rect x="672" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="400" fill="#087e8b" font-size="15">STEP 04</text><text x="692" y="435" fill="#102d40" font-size="23" font-weight="600">试运行</text><text x="692" y="466" fill="#4f6473" font-size="16">分组观察及故障演练</text></g><g><rect x="360" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="400" fill="#087e8b" font-size="15">STEP 05</text><text x="380" y="435" fill="#102d40" font-size="23" font-weight="600">验收</text><text x="380" y="466" fill="#4f6473" font-size="16">冻结样本及签署结论</text></g><g><rect x="48" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="400" fill="#087e8b" font-size="15">STEP 06</text><text x="68" y="435" fill="#102d40" font-size="23" font-weight="600">移交</text><text x="68" y="466" fill="#4f6473" font-size="16">值班、恢复及遗留事项</text></g><text x="48" y="540" fill="#536d7c" font-size="14">来源：fde.loyo.work</text></g></svg>