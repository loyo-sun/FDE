<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">解决方案架构与技术取舍章节图解</title><desc id="desc">架构从约束出发 → 贯穿案例的逻辑组件 → 技术取舍的决策记录 → 故障与降级设计 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">解决方案架构与技术取舍</text><text x="30" y="80" font-size="16" fill="#b5dce0">建立组件、边界、部署形态与关键决策记录。</text><a href="/docs/solution-architecture/#%E6%9E%B6%E6%9E%84%E4%BB%8E%E7%BA%A6%E6%9D%9F%E5%87%BA%E5%8F%91"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">架构从约束出发</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">先记录用户规模、峰值任务量、可接受等待、</text></g></a><a href="/docs/solution-architecture/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E9%80%BB%E8%BE%91%E7%BB%84%E4%BB%B6"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">贯穿案例的逻辑组件</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">浏览器工作台调用后端服务；后端验证用户和</text></g></a><a href="/docs/solution-architecture/#%E6%8A%80%E6%9C%AF%E5%8F%96%E8%88%8D%E7%9A%84%E5%86%B3%E7%AD%96%E8%AE%B0%E5%BD%95"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">技术取舍的决策记录</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">用 ADR 模板记录背景、候选、证据、决</text></g></a><a href="/docs/solution-architecture/#%E6%95%85%E9%9A%9C%E4%B8%8E%E9%99%8D%E7%BA%A7%E8%AE%BE%E8%AE%A1"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">故障与降级设计</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">模型不可用时保留普通搜索与人工回复；索引</text></g></a><a href="/docs/solution-architecture/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">提交组件图、数据流、信任边界、三个关键 </text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>