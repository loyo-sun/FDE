<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">案例沉淀与工具管理章节图解</title><desc id="desc">案例分类 → 案例模板 → 工具箱分类 → 工具准入 → 三个合成案例供练习 → 工具选择表 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">案例沉淀与工具管理</text><text x="30" y="80" font-size="16" fill="#b5dce0">说明案例记录方法与工具准入标准，真实案例逐步补充。</text><a href="/docs/cases-and-toolkit/#%E6%A1%88%E4%BE%8B%E5%88%86%E7%B1%BB"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">案例分类</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">成功交付、重大故障、需求变更、性能优化、</text></g></a><a href="/docs/cases-and-toolkit/#%E6%A1%88%E4%BE%8B%E6%A8%A1%E6%9D%BF"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">案例模板</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">背景、环境和版本。</text></g></a><a href="/docs/cases-and-toolkit/#%E5%B7%A5%E5%85%B7%E7%AE%B1%E5%88%86%E7%B1%BB"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">工具箱分类</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">环境检查：操作系统、时间、资源、端口和依</text></g></a><a href="/docs/cases-and-toolkit/#%E5%B7%A5%E5%85%B7%E5%87%86%E5%85%A5"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">工具准入</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">工具必须说明来源、版本、支持平台、输入输</text></g></a><a href="/docs/cases-and-toolkit/#%E4%B8%89%E4%B8%AA%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E4%BE%9B%E7%BB%83%E4%B9%A0"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">三个合成案例供练习</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">这些案例描述设计与诊断思路，没有真实客户</text></g></a><a href="/docs/cases-and-toolkit/#%E5%B7%A5%E5%85%B7%E9%80%89%E6%8B%A9%E8%A1%A8"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">工具选择表</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">本文不锁定某个商业产品，也不把工具安装视</text></g></a><a href="/docs/cases-and-toolkit/#%E7%BB%83%E4%B9%A0"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">练习</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">选择一个故障案例，写证据表和排除过程。用</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>