<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">身份认证与权限设计章节图解</title><desc id="desc">区分身份、权限与资源归属 → 合成案例的权限矩阵 → 授权落点 → 凭据与服务身份 → 必测反例 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">身份认证与权限设计</text><text x="30" y="80" font-size="16" fill="#b5dce0">设计用户、服务、租户和资源的访问边界。</text><a href="/docs/identity-access/#%E5%8C%BA%E5%88%86%E8%BA%AB%E4%BB%BD%E6%9D%83%E9%99%90%E4%B8%8E%E8%B5%84%E6%BA%90%E5%BD%92%E5%B1%9E"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">区分身份、权限与资源归属</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">认证回答“是谁”，授权回答“能对哪个资源</text></g></a><a href="/docs/identity-access/#%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E7%9A%84%E6%9D%83%E9%99%90%E7%9F%A9%E9%98%B5"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">合成案例的权限矩阵</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">这只是示例，需要资源负责人确认。系统管理</text></g></a><a href="/docs/identity-access/#%E6%8E%88%E6%9D%83%E8%90%BD%E7%82%B9"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">授权落点</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">请求入口验证身份；业务服务检查动作与目标</text></g></a><a href="/docs/identity-access/#%E5%87%AD%E6%8D%AE%E4%B8%8E%E6%9C%8D%E5%8A%A1%E8%BA%AB%E4%BB%BD"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">凭据与服务身份</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">服务使用独立身份与最小权限，避免共享管理</text></g></a><a href="/docs/identity-access/#%E5%BF%85%E6%B5%8B%E5%8F%8D%E4%BE%8B"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">必测反例</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">替换工单编号访问其他租户；直接调用界面隐</text></g></a><a href="/docs/identity-access/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">交付权限矩阵、授权流程、撤权时效目标与拒</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>