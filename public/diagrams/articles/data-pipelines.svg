<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">数据接入与处理管道章节图解</title><desc id="desc">数据接入是可恢复的过程 → 接入步骤与控制点 → 增量、重跑与删除 → 贯穿案例的异常处理 → 对账与质量报告 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">数据接入与处理管道</text><text x="30" y="80" font-size="16" fill="#b5dce0">构建可重跑、可追踪并能处理脏数据的接入链路。</text><a href="/docs/data-pipelines/#%E6%95%B0%E6%8D%AE%E6%8E%A5%E5%85%A5%E6%98%AF%E5%8F%AF%E6%81%A2%E5%A4%8D%E7%9A%84%E8%BF%87%E7%A8%8B"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">数据接入是可恢复的过程</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">文档“导入完成”不代表内容正确、权限有效</text></g></a><a href="/docs/data-pipelines/#%E6%8E%A5%E5%85%A5%E6%AD%A5%E9%AA%A4%E4%B8%8E%E6%8E%A7%E5%88%B6%E7%82%B9"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">接入步骤与控制点</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/data-pipelines/#%E5%A2%9E%E9%87%8F%E9%87%8D%E8%B7%91%E4%B8%8E%E5%88%A0%E9%99%A4"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">增量、重跑与删除</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">用来源标识、版本和内容哈希区分“同一内容</text></g></a><a href="/docs/data-pipelines/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">贯穿案例的异常处理</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">手册 M-101 从 v1 更新到 v2</text></g></a><a href="/docs/data-pipelines/#%E5%AF%B9%E8%B4%A6%E4%B8%8E%E8%B4%A8%E9%87%8F%E6%8A%A5%E5%91%8A"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">对账与质量报告</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">每个批次报告读取、成功、失败、跳过和删除</text></g></a><a href="/docs/data-pipelines/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">用相同批次运行两次，确认有效对象不翻倍；</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>