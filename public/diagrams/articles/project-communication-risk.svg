<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">项目沟通、风险与变更章节图解</title><desc id="desc">沟通机制 → 周报最小结构 → 风险管理 → 问题升级 → 变更控制 → 可直接套用的周报内容 → 风险、问题与变更分开管理 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">项目沟通、风险与变更</text><text x="30" y="80" font-size="16" fill="#b5dce0">管理里程碑、范围、风险和升级机制。</text><a href="/docs/project-communication-risk/#%E6%B2%9F%E9%80%9A%E6%9C%BA%E5%88%B6"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">沟通机制</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">启动时明确日常接口人、技术负责人、项目负</text></g></a><a href="/docs/project-communication-risk/#%E5%91%A8%E6%8A%A5%E6%9C%80%E5%B0%8F%E7%BB%93%E6%9E%84"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">周报最小结构</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">本周完成及对应证据。</text></g></a><a href="/docs/project-communication-risk/#%E9%A3%8E%E9%99%A9%E7%AE%A1%E7%90%86"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">风险管理</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">风险描述使用“如果……可能导致……”结构</text></g></a><a href="/docs/project-communication-risk/#%E9%97%AE%E9%A2%98%E5%8D%87%E7%BA%A7"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">问题升级</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">满足重大业务影响、关键里程碑可能延误、安</text></g></a><a href="/docs/project-communication-risk/#%E5%8F%98%E6%9B%B4%E6%8E%A7%E5%88%B6"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">变更控制</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">任何影响范围、周期、费用、架构或验收标准</text></g></a><a href="/docs/project-communication-risk/#%E5%8F%AF%E7%9B%B4%E6%8E%A5%E5%A5%97%E7%94%A8%E7%9A%84%E5%91%A8%E6%8A%A5%E5%86%85%E5%AE%B9"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">可直接套用的周报内容</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">这是合成示例，不能填写没有实际执行的“通</text></g></a><a href="/docs/project-communication-risk/#%E9%A3%8E%E9%99%A9%E9%97%AE%E9%A2%98%E4%B8%8E%E5%8F%98%E6%9B%B4%E5%88%86%E5%BC%80%E7%AE%A1%E7%90%86"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">风险、问题与变更分开管理</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">风险是可能发生的事件，问题是已经发生的障</text></g></a><a href="/docs/project-communication-risk/#%E7%BB%83%E4%B9%A0"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">练习</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">模拟客户要求自动关闭工单，写一份含事实、</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>