<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">原型与技术验证章节图解</title><desc id="desc">原型服务于决策 → 实验卡片 → 用最小技术切片验证集成 → 时间盒与产出 → 从原型走向生产的缺口 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">原型与技术验证</text><text x="30" y="80" font-size="16" fill="#b5dce0">通过最小原型验证高风险假设，明确继续或停止的条件。</text><a href="/docs/prototype-validation/#%E5%8E%9F%E5%9E%8B%E6%9C%8D%E5%8A%A1%E4%BA%8E%E5%86%B3%E7%AD%96"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">原型服务于决策</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">原型不是缩小版成品，而是验证某个高风险假</text></g></a><a href="/docs/prototype-validation/#%E5%AE%9E%E9%AA%8C%E5%8D%A1%E7%89%87"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">实验卡片</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/prototype-validation/#%E7%94%A8%E6%9C%80%E5%B0%8F%E6%8A%80%E6%9C%AF%E5%88%87%E7%89%87%E9%AA%8C%E8%AF%81%E9%9B%86%E6%88%90"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">用最小技术切片验证集成</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">先连通身份、单条工单、单份资料和单条草稿</text></g></a><a href="/docs/prototype-validation/#%E6%97%B6%E9%97%B4%E7%9B%92%E4%B8%8E%E4%BA%A7%E5%87%BA"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">时间盒与产出</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">为实验设置短时间盒，例如三天，这是组织工</text></g></a><a href="/docs/prototype-validation/#%E4%BB%8E%E5%8E%9F%E5%9E%8B%E8%B5%B0%E5%90%91%E7%94%9F%E4%BA%A7%E7%9A%84%E7%BC%BA%E5%8F%A3"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">从原型走向生产的缺口</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/prototype-validation/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">用实验记录模板写一个可以失败的实验；让评</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>