<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">数据分级与隐私保护章节图解</title><desc id="desc">用数据生命周期组织保护措施 → 合成案例的数据台账 → 接入前检查 → 删除与撤权的实现 → 验证与练习</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">数据分级与隐私保护</text><text x="30" y="80" font-size="16" fill="#b5dce0">定义数据的收集、处理、保留和删除边界。</text><a href="/docs/data-privacy/#%E7%94%A8%E6%95%B0%E6%8D%AE%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F%E7%BB%84%E7%BB%87%E4%BF%9D%E6%8A%A4%E6%8E%AA%E6%96%BD"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">用数据生命周期组织保护措施</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">先清点收集什么、为何需要、谁能用、在哪里</text></g></a><a href="/docs/data-privacy/#%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E7%9A%84%E6%95%B0%E6%8D%AE%E5%8F%B0%E8%B4%A6"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">合成案例的数据台账</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">“脱敏”不是简单删除姓名。型号、时间、地</text></g></a><a href="/docs/data-privacy/#%E6%8E%A5%E5%85%A5%E5%89%8D%E6%A3%80%E6%9F%A5"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">接入前检查</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">确认收集目的与授权边界；查看供应商处理位</text></g></a><a href="/docs/data-privacy/#%E5%88%A0%E9%99%A4%E4%B8%8E%E6%92%A4%E6%9D%83%E7%9A%84%E5%AE%9E%E7%8E%B0"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">删除与撤权的实现</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">按来源编号追踪原文、解析内容、切片、索引</text></g></a><a href="/docs/data-privacy/#%E9%AA%8C%E8%AF%81%E4%B8%8E%E7%BB%83%E4%B9%A0"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">验证与练习</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">用虚构标识 DEMO-PERSON-10</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>