<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">知识库治理与文档标准章节图解</title><desc id="desc">按内容类型约定结构 → 文档元数据 → 发布流程 → 生命周期 → 质量指标 → AI 索引要求 → 本仓库的实际字段与发布边界 → 内容维护责任与节奏 → 图片和资料来源 → 质量门禁</desc><rect width="960" height="700" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">知识库治理与文档标准</text><text x="30" y="80" font-size="16" fill="#b5dce0">区分大纲、概念指南和操作手册，维护内容状态与证据。</text><a href="/docs/knowledge-governance/#%E6%8C%89%E5%86%85%E5%AE%B9%E7%B1%BB%E5%9E%8B%E7%BA%A6%E5%AE%9A%E7%BB%93%E6%9E%84"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">按内容类型约定结构</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">待完善大纲（outline）：学习目标、</text></g></a><a href="/docs/knowledge-governance/#%E6%96%87%E6%A1%A3%E5%85%83%E6%95%B0%E6%8D%AE"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">文档元数据</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">每篇文档包含下述仓库已实现的元数据；生产</text></g></a><a href="/docs/knowledge-governance/#%E5%8F%91%E5%B8%83%E6%B5%81%E7%A8%8B"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">发布流程</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">建议流程：作者提交文档 → 执行类型、链</text></g></a><a href="/docs/knowledge-governance/#%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">生命周期</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">草稿：尚不能指导现场执行。</text></g></a><a href="/docs/knowledge-governance/#%E8%B4%A8%E9%87%8F%E6%8C%87%E6%A0%87"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">质量指标</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">搜索无结果率、文档使用率、问题解决率、过</text></g></a><a href="/docs/knowledge-governance/#ai-%E7%B4%A2%E5%BC%95%E8%A6%81%E6%B1%82"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">AI 索引要求</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">标题直接表达问题，段落有清晰语义边界，结</text></g></a><a href="/docs/knowledge-governance/#%E6%9C%AC%E4%BB%93%E5%BA%93%E7%9A%84%E5%AE%9E%E9%99%85%E5%AD%97%E6%AE%B5%E4%B8%8E%E5%8F%91%E5%B8%83%E8%BE%B9%E7%95%8C"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">本仓库的实际字段与发布边界</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">当前已实现的元数据为 title、des</text></g></a><a href="/docs/knowledge-governance/#%E5%86%85%E5%AE%B9%E7%BB%B4%E6%8A%A4%E8%B4%A3%E4%BB%BB%E4%B8%8E%E8%8A%82%E5%A5%8F"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">内容维护责任与节奏</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">建议每月处理失效链接与反馈，每季度审查全</text></g></a><a href="/docs/knowledge-governance/#%E5%9B%BE%E7%89%87%E5%92%8C%E8%B5%84%E6%96%99%E6%9D%A5%E6%BA%90"><g><rect x="650" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="417" font-size="13" fill="#147c87">PART 09</text><text x="666" y="444" font-size="18" fill="#14384a">图片和资料来源</text><text x="666" y="466" font-size="18" fill="#14384a"></text><text x="666" y="490" font-size="12" fill="#536c78">所有配图都是本知识库原创 SVG 示意图</text></g></a><a href="/docs/knowledge-governance/#%E8%B4%A8%E9%87%8F%E9%97%A8%E7%A6%81"><g><rect x="30" y="522" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="547" font-size="13" fill="#147c87">PART 10</text><text x="46" y="574" font-size="18" fill="#14384a">质量门禁</text><text x="46" y="596" font-size="18" fill="#14384a"></text><text x="46" y="620" font-size="12" fill="#536c78">构建检查 MDX、类型、内容链接、静态页</text></g></a><text x="30" y="682" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>