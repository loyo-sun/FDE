<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">交付生命周期章节图解</title><desc id="desc">FDE 项目起点 → 端到端流程 → 阶段门禁 → 阶段状态 → 交付完成定义 → 合成案例的阶段证据 → 处理阻塞与变化 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">交付生命周期</text><text x="30" y="80" font-size="16" fill="#b5dce0">串联问题定义、开发迭代、试运行、验收与移交。</text><a href="/docs/delivery-lifecycle/#fde-%E9%A1%B9%E7%9B%AE%E8%B5%B7%E7%82%B9"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">FDE 项目起点</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">先完成客户问题定义、成功指标与原型验证，</text></g></a><a href="/docs/delivery-lifecycle/#%E7%AB%AF%E5%88%B0%E7%AB%AF%E6%B5%81%E7%A8%8B"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">端到端流程</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">售前交接 → 项目启动 → 现场勘查 →</text></g></a><a href="/docs/delivery-lifecycle/#%E9%98%B6%E6%AE%B5%E9%97%A8%E7%A6%81"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">阶段门禁</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">确认合同范围、非标承诺、验收指标和责任边</text></g></a><a href="/docs/delivery-lifecycle/#%E9%98%B6%E6%AE%B5%E7%8A%B6%E6%80%81"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">阶段状态</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">每个阶段只使用四种状态：未开始、进行中、</text></g></a><a href="/docs/delivery-lifecycle/#%E4%BA%A4%E4%BB%98%E5%AE%8C%E6%88%90%E5%AE%9A%E4%B9%89"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">交付完成定义</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">系统可用、指标通过、资料齐全、人员会用、</text></g></a><a href="/docs/delivery-lifecycle/#%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E7%9A%84%E9%98%B6%E6%AE%B5%E8%AF%81%E6%8D%AE"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">合成案例的阶段证据</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">进入下一阶段不要求所有未来问题解决，但必</text></g></a><a href="/docs/delivery-lifecycle/#%E5%A4%84%E7%90%86%E9%98%BB%E5%A1%9E%E4%B8%8E%E5%8F%98%E5%8C%96"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">处理阻塞与变化</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">如果手册授权迟迟未确认，可以继续用合成数</text></g></a><a href="/docs/delivery-lifecycle/#%E7%BB%83%E4%B9%A0"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">练习</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">为同一项目建立六阶段清单，每阶段链接一个</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>