<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">工程基础与开发环境章节图解</title><desc id="desc">适用场景与学习目标 → 建立最小工程闭环 → 应掌握的基础与验证方式 → 贯穿案例：先做查询，再做 AI → 常见失败与改进 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">工程基础与开发环境</text><text x="30" y="80" font-size="16" fill="#b5dce0">补齐编程、系统、网络、Git 与调试的基础。</text><a href="/docs/engineering-foundations/#%E9%80%82%E7%94%A8%E5%9C%BA%E6%99%AF%E4%B8%8E%E5%AD%A6%E4%B9%A0%E7%9B%AE%E6%A0%87"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">适用场景与学习目标</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">面向能阅读基础代码、但尚未独立完成客户项</text></g></a><a href="/docs/engineering-foundations/#%E5%BB%BA%E7%AB%8B%E6%9C%80%E5%B0%8F%E5%B7%A5%E7%A8%8B%E9%97%AD%E7%8E%AF"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">建立最小工程闭环</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">建立版本仓库，提交依赖锁文件、配置样例和</text></g></a><a href="/docs/engineering-foundations/#%E5%BA%94%E6%8E%8C%E6%8F%A1%E7%9A%84%E5%9F%BA%E7%A1%80%E4%B8%8E%E9%AA%8C%E8%AF%81%E6%96%B9%E5%BC%8F"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">应掌握的基础与验证方式</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/engineering-foundations/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E5%85%88%E5%81%9A%E6%9F%A5%E8%AF%A2%E5%86%8D%E5%81%9A-ai"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">贯穿案例：先做查询，再做 A</text><text x="46" y="336" font-size="18" fill="#14384a">I</text><text x="46" y="360" font-size="12" fill="#536c78">售后工单助手首先应该能够读取工单 T-1</text></g></a><a href="/docs/engineering-foundations/#%E5%B8%B8%E8%A7%81%E5%A4%B1%E8%B4%A5%E4%B8%8E%E6%94%B9%E8%BF%9B"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">常见失败与改进</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">只保存截图：同时保存脱敏请求、响应和版本</text></g></a><a href="/docs/engineering-foundations/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">提交最小服务、配置样例、四类用例和运行说</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>