<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">FDE 岗位与能力模型章节图解</title><desc id="desc">FDE 是什么 → 核心工作循环 → 协作边界 → 六项核心能力 → 以产出评估能力 → 术语参考 → 角色边界与协作示例 → 每周应留下什么 → 自我评估练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">FDE 岗位与能力模型</text><text x="30" y="80" font-size="16" fill="#b5dce0">理解 Forward Deployed Engineer 的责任、工程能力与协作边界。</text><a href="/docs/role-and-competency/#fde-%E6%98%AF%E4%BB%80%E4%B9%88"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">FDE 是什么</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">FDE 是 Forward Deploy</text></g></a><a href="/docs/role-and-competency/#%E6%A0%B8%E5%BF%83%E5%B7%A5%E4%BD%9C%E5%BE%AA%E7%8E%AF"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">核心工作循环</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">客户访谈与现场观察 → 定义问题与成功指</text></g></a><a href="/docs/role-and-competency/#%E5%8D%8F%E4%BD%9C%E8%BE%B9%E7%95%8C"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">协作边界</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/role-and-competency/#%E5%85%AD%E9%A1%B9%E6%A0%B8%E5%BF%83%E8%83%BD%E5%8A%9B"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">六项核心能力</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">问题发现：从客户诉求中识别真实工作流、价</text></g></a><a href="/docs/role-and-competency/#%E4%BB%A5%E4%BA%A7%E5%87%BA%E8%AF%84%E4%BC%B0%E8%83%BD%E5%8A%9B"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">以产出评估能力</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">入门阶段提交问题定义、可运行的最小应用和</text></g></a><a href="/docs/role-and-competency/#%E6%9C%AF%E8%AF%AD%E5%8F%82%E8%80%83"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">术语参考</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/role-and-competency/#%E8%A7%92%E8%89%B2%E8%BE%B9%E7%95%8C%E4%B8%8E%E5%8D%8F%E4%BD%9C%E7%A4%BA%E4%BE%8B"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">角色边界与协作示例</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">FDE 的具体职责因公司和项目而异。本知</text></g></a><a href="/docs/role-and-competency/#%E6%AF%8F%E5%91%A8%E5%BA%94%E7%95%99%E4%B8%8B%E4%BB%80%E4%B9%88"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">每周应留下什么</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">一项经过取证的问题澄清、一项可运行工程变</text></g></a><a href="/docs/role-and-competency/#%E8%87%AA%E6%88%91%E8%AF%84%E4%BC%B0%E7%BB%83%E4%B9%A0"><g><rect x="650" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="417" font-size="13" fill="#147c87">PART 09</text><text x="666" y="444" font-size="18" fill="#14384a">自我评估练习</text><text x="666" y="466" font-size="18" fill="#14384a"></text><text x="666" y="490" font-size="12" fill="#536c78">请用五分钟解释一个项目：用户遇到什么障碍</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>