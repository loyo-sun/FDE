<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">业务流程与用户研究章节图解</title><desc id="desc">用真实任务还原流程 → 建模步骤 → 贯穿案例的现状与目标 → 识别瓶颈与验证收益 → 常见失败 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">业务流程与用户研究</text><text x="30" y="80" font-size="16" fill="#b5dce0">找出真实工作流中的瓶颈、例外与人工判断。</text><a href="/docs/workflow-mapping/#%E7%94%A8%E7%9C%9F%E5%AE%9E%E4%BB%BB%E5%8A%A1%E8%BF%98%E5%8E%9F%E6%B5%81%E7%A8%8B"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">用真实任务还原流程</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">流程图需要呈现跨人、跨系统的交接和例外。</text></g></a><a href="/docs/workflow-mapping/#%E5%BB%BA%E6%A8%A1%E6%AD%A5%E9%AA%A4"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">建模步骤</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">明确起点和终点，例如“收到告警工单”到“</text></g></a><a href="/docs/workflow-mapping/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E7%8E%B0%E7%8A%B6%E4%B8%8E%E7%9B%AE%E6%A0%87"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">贯穿案例的现状与目标</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">目标流程不允许模型猜测缺失型号。资料不足</text></g></a><a href="/docs/workflow-mapping/#%E8%AF%86%E5%88%AB%E7%93%B6%E9%A2%88%E4%B8%8E%E9%AA%8C%E8%AF%81%E6%94%B6%E7%9B%8A"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">识别瓶颈与验证收益</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">记录任务编号、难度、各环节开始结束时间、</text></g></a><a href="/docs/workflow-mapping/#%E5%B8%B8%E8%A7%81%E5%A4%B1%E8%B4%A5"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">常见失败</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">只访谈管理者会漏掉实际绕行；只测成功任务</text></g></a><a href="/docs/workflow-mapping/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">提交现状与目标两张泳道图、五个异常分支和</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>