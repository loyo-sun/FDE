<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">RAG 知识工程章节图解</title><desc id="desc">内容接入 → 切片原则 → 检索链路 → 必测问题 → 更新验证 → 贯穿案例的最小切片元数据 → 分开评测检索与回答 → 更新与撤销演练</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">RAG 知识工程</text><text x="30" y="80" font-size="16" fill="#b5dce0">设计文档接入、检索、引用与知识更新链路。</text><a href="/docs/rag-knowledge-engineering/#%E5%86%85%E5%AE%B9%E6%8E%A5%E5%85%A5"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">内容接入</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">确认数据来源、更新频率、权限、语言、版本</text></g></a><a href="/docs/rag-knowledge-engineering/#%E5%88%87%E7%89%87%E5%8E%9F%E5%88%99"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">切片原则</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">优先按标题和语义边界切片，不做机械定长截</text></g></a><a href="/docs/rag-knowledge-engineering/#%E6%A3%80%E7%B4%A2%E9%93%BE%E8%B7%AF"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">检索链路</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">查询改写 → 关键词与向量混合召回 → </text></g></a><a href="/docs/rag-knowledge-engineering/#%E5%BF%85%E6%B5%8B%E9%97%AE%E9%A2%98"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">必测问题</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">精确错误码是否能命中。</text></g></a><a href="/docs/rag-knowledge-engineering/#%E6%9B%B4%E6%96%B0%E9%AA%8C%E8%AF%81"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">更新验证</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">更新知识后检查文档数量、切片数量、失败记</text></g></a><a href="/docs/rag-knowledge-engineering/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E6%9C%80%E5%B0%8F%E5%88%87%E7%89%87%E5%85%83%E6%95%B0%E6%8D%AE"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">贯穿案例的最小切片元数据</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">字段仅为合成设计。文档级访问规则在切片中</text></g></a><a href="/docs/rag-knowledge-engineering/#%E5%88%86%E5%BC%80%E8%AF%84%E6%B5%8B%E6%A3%80%E7%B4%A2%E4%B8%8E%E5%9B%9E%E7%AD%94"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">分开评测检索与回答</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">Recall@k 可用于衡量前 k 个结</text></g></a><a href="/docs/rag-knowledge-engineering/#%E6%9B%B4%E6%96%B0%E4%B8%8E%E6%92%A4%E9%94%80%E6%BC%94%E7%BB%83"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">更新与撤销演练</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">依次添加 v2、停用 v1、删除一个片段</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>