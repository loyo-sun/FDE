<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">AI 基础与能力边界章节图解</title><desc id="desc">核心概念 → 方案选择 → 典型能力边界 → 部署形态 → 用任务分解选择方案 → 成本与上下文 → 提示词的最小结构 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">AI 基础与能力边界</text><text x="30" y="80" font-size="16" fill="#b5dce0">理解模型、Prompt、RAG、Agent 与部署选择。</text><a href="/docs/ai-foundations/#%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">核心概念</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">Token：模型处理文本的基本计量单位，</text></g></a><a href="/docs/ai-foundations/#%E6%96%B9%E6%A1%88%E9%80%89%E6%8B%A9"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">方案选择</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/ai-foundations/#%E5%85%B8%E5%9E%8B%E8%83%BD%E5%8A%9B%E8%BE%B9%E7%95%8C"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">典型能力边界</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">模型可能产生幻觉、遗漏约束、输出格式波动</text></g></a><a href="/docs/ai-foundations/#%E9%83%A8%E7%BD%B2%E5%BD%A2%E6%80%81"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">部署形态</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">云端 API 适合快速启动；私有化部署适</text></g></a><a href="/docs/ai-foundations/#%E7%94%A8%E4%BB%BB%E5%8A%A1%E5%88%86%E8%A7%A3%E9%80%89%E6%8B%A9%E6%96%B9%E6%A1%88"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">用任务分解选择方案</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">工单助手的设备型号识别可以先用结构化字段</text></g></a><a href="/docs/ai-foundations/#%E6%88%90%E6%9C%AC%E4%B8%8E%E4%B8%8A%E4%B8%8B%E6%96%87"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">成本与上下文</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">输入、输出、检索、基础设施和人工审核共同</text></g></a><a href="/docs/ai-foundations/#%E6%8F%90%E7%A4%BA%E8%AF%8D%E7%9A%84%E6%9C%80%E5%B0%8F%E7%BB%93%E6%9E%84"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">提示词的最小结构</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">写清任务、适用证据、禁止猜测的字段、输出</text></g></a><a href="/docs/ai-foundations/#%E7%BB%83%E4%B9%A0"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">练习</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">用同一批合成任务比较搜索、仅提示词和 R</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>