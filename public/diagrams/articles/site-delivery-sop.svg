<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">部署、联调与上线准备章节图解</title><desc id="desc">实施前检查 → 标准作业顺序 → 验证原则 → 回退触发条件 → 现场记录 → 上线验证矩阵 → 回退必须覆盖什么 → 演练与记录</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">部署、联调与上线准备</text><text x="30" y="80" font-size="16" fill="#b5dce0">检查环境、配置、依赖、联调和回退准备。</text><a href="/docs/site-delivery-sop/#%E5%AE%9E%E6%96%BD%E5%89%8D%E6%A3%80%E6%9F%A5"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">实施前检查</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">客户、项目和环境信息与工单一致。</text></g></a><a href="/docs/site-delivery-sop/#%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A%E9%A1%BA%E5%BA%8F"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">标准作业顺序</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">记录变更前状态和关键指标。</text></g></a><a href="/docs/site-delivery-sop/#%E9%AA%8C%E8%AF%81%E5%8E%9F%E5%88%99"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">验证原则</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">验证必须回答三个问题：系统是否运行、业务</text></g></a><a href="/docs/site-delivery-sop/#%E5%9B%9E%E9%80%80%E8%A7%A6%E5%8F%91%E6%9D%A1%E4%BB%B6"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">回退触发条件</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">超出批准的变更窗口。</text></g></a><a href="/docs/site-delivery-sop/#%E7%8E%B0%E5%9C%BA%E8%AE%B0%E5%BD%95"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">现场记录</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">记录时间、操作者、命令或动作、执行结果、</text></g></a><a href="/docs/site-delivery-sop/#%E4%B8%8A%E7%BA%BF%E9%AA%8C%E8%AF%81%E7%9F%A9%E9%98%B5"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">上线验证矩阵</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">本文是通用指南，不包含某个客户环境可直接</text></g></a><a href="/docs/site-delivery-sop/#%E5%9B%9E%E9%80%80%E5%BF%85%E9%A1%BB%E8%A6%86%E7%9B%96%E4%BB%80%E4%B9%88"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">回退必须覆盖什么</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">保存应用、配置、提示词、模型标识和知识索</text></g></a><a href="/docs/site-delivery-sop/#%E6%BC%94%E7%BB%83%E4%B8%8E%E8%AE%B0%E5%BD%95"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">演练与记录</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">先在等价测试环境演练，再在窗口中执行批准</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>