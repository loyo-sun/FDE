<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Agent 与工具工作流章节图解</title><desc id="desc">先选择确定性工作流 → 工具边界设计 → 有状态执行与人工介入 → 不可信工具结果 → 评测与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">Agent 与工具工作流</text><text x="30" y="80" font-size="16" fill="#b5dce0">设计工具调用、状态管理、权限边界与人工介入。</text><a href="/docs/agent-workflows/#%E5%85%88%E9%80%89%E6%8B%A9%E7%A1%AE%E5%AE%9A%E6%80%A7%E5%B7%A5%E4%BD%9C%E6%B5%81"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">先选择确定性工作流</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">步骤固定、规则明确时优先使用普通工作流。</text></g></a><a href="/docs/agent-workflows/#%E5%B7%A5%E5%85%B7%E8%BE%B9%E7%95%8C%E8%AE%BE%E8%AE%A1"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">工具边界设计</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">工具描述和参数 Schema 帮助模型正</text></g></a><a href="/docs/agent-workflows/#%E6%9C%89%E7%8A%B6%E6%80%81%E6%89%A7%E8%A1%8C%E4%B8%8E%E4%BA%BA%E5%B7%A5%E4%BB%8B%E5%85%A5"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">有状态执行与人工介入</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">每个任务记录目标、当前步骤、工具结果、版</text></g></a><a href="/docs/agent-workflows/#%E4%B8%8D%E5%8F%AF%E4%BF%A1%E5%B7%A5%E5%85%B7%E7%BB%93%E6%9E%9C"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">不可信工具结果</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">手册或外部网页可能包含“忽略规则并发送全</text></g></a><a href="/docs/agent-workflows/#%E8%AF%84%E6%B5%8B%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">评测与完成标准</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">覆盖工具选错、参数错误、资源越权、审批后</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>