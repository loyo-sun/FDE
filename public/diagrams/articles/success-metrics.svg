<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">价值假设与成功指标章节图解</title><desc id="desc">建立业务、质量与风险三层指标 → 合成案例的指标字典 → 基线和试点如何比较 → 经济性估计 → 练习与评审</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">价值假设与成功指标</text><text x="30" y="80" font-size="16" fill="#b5dce0">把业务目标转成可测量的基线、目标和验收证据。</text><a href="/docs/success-metrics/#%E5%BB%BA%E7%AB%8B%E4%B8%9A%E5%8A%A1%E8%B4%A8%E9%87%8F%E4%B8%8E%E9%A3%8E%E9%99%A9%E4%B8%89%E5%B1%82%E6%8C%87%E6%A0%87"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">建立业务、质量与风险三层指标</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">业务指标解释是否值得使用，质量指标解释系</text></g></a><a href="/docs/success-metrics/#%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E7%9A%84%E6%8C%87%E6%A0%87%E5%AD%97%E5%85%B8"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">合成案例的指标字典</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">以下数值仅用于练习，需要在真实项目中重新</text></g></a><a href="/docs/success-metrics/#%E5%9F%BA%E7%BA%BF%E5%92%8C%E8%AF%95%E7%82%B9%E5%A6%82%E4%BD%95%E6%AF%94%E8%BE%83"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">基线和试点如何比较</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">先固定任务范围、难度标签和观察窗口。对同</text></g></a><a href="/docs/success-metrics/#%E7%BB%8F%E6%B5%8E%E6%80%A7%E4%BC%B0%E8%AE%A1"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">经济性估计</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">月度净收益估计 = 可实际释放的工时价值</text></g></a><a href="/docs/success-metrics/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E8%AF%84%E5%AE%A1"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">练习与评审</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">填写指标与评测模板，为每个指标指定负责人</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>