<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">业务应用与工作流界面章节图解</title><desc id="desc">围绕任务设计工作台 → 最小工作台布局 → 状态与错误体验 → 可访问性与现场可用性 → 练习与评审</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">业务应用与工作流界面</text><text x="30" y="80" font-size="16" fill="#b5dce0">把模型和接口变成用户能完成任务的工具。</text><a href="/docs/workflow-apps/#%E5%9B%B4%E7%BB%95%E4%BB%BB%E5%8A%A1%E8%AE%BE%E8%AE%A1%E5%B7%A5%E4%BD%9C%E5%8F%B0"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">围绕任务设计工作台</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">业务应用的目标是让用户完成任务。对售后工</text></g></a><a href="/docs/workflow-apps/#%E6%9C%80%E5%B0%8F%E5%B7%A5%E4%BD%9C%E5%8F%B0%E5%B8%83%E5%B1%80"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">最小工作台布局</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">“采用草稿”与“发送给客户”应有明确区别</text></g></a><a href="/docs/workflow-apps/#%E7%8A%B6%E6%80%81%E4%B8%8E%E9%94%99%E8%AF%AF%E4%BD%93%E9%AA%8C"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">状态与错误体验</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">提交后立即给出可追踪任务编号；长任务允许</text></g></a><a href="/docs/workflow-apps/#%E5%8F%AF%E8%AE%BF%E9%97%AE%E6%80%A7%E4%B8%8E%E7%8E%B0%E5%9C%BA%E5%8F%AF%E7%94%A8%E6%80%A7"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">可访问性与现场可用性</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">核心操作支持键盘与清晰焦点；状态不能只依</text></g></a><a href="/docs/workflow-apps/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E8%AF%84%E5%AE%A1"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">练习与评审</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">选择五个任务：正常生成、资料不足、无权限</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>