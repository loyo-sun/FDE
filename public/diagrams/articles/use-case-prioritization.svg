<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">场景筛选与范围界定章节图解</title><desc id="desc">先判断是否值得做 → 一个可调整的筛选方法 → 从排名到范围契约 → 处理范围变化 → 敏感性与停止条件 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">场景筛选与范围界定</text><text x="30" y="80" font-size="16" fill="#b5dce0">按价值、可行性、数据准备度和风险选择首个场景。</text><a href="/docs/use-case-prioritization/#%E5%85%88%E5%88%A4%E6%96%AD%E6%98%AF%E5%90%A6%E5%80%BC%E5%BE%97%E5%81%9A"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">先判断是否值得做</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">首个场景应同时具备清晰用户、可获取数据、</text></g></a><a href="/docs/use-case-prioritization/#%E4%B8%80%E4%B8%AA%E5%8F%AF%E8%B0%83%E6%95%B4%E7%9A%84%E7%AD%9B%E9%80%89%E6%96%B9%E6%B3%95"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">一个可调整的筛选方法</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">在团队共同确认口径后，按 1—5 分评分</text></g></a><a href="/docs/use-case-prioritization/#%E4%BB%8E%E6%8E%92%E5%90%8D%E5%88%B0%E8%8C%83%E5%9B%B4%E5%A5%91%E7%BA%A6"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">从排名到范围契约</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">首期选择回复草稿：支持一个设备系列、只读</text></g></a><a href="/docs/use-case-prioritization/#%E5%A4%84%E7%90%86%E8%8C%83%E5%9B%B4%E5%8F%98%E5%8C%96"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">处理范围变化</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">新增设备系列会影响资料版本、评测集和培训</text></g></a><a href="/docs/use-case-prioritization/#%E6%95%8F%E6%84%9F%E6%80%A7%E4%B8%8E%E5%81%9C%E6%AD%A2%E6%9D%A1%E4%BB%B6"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">敏感性与停止条件</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">把价值或数据分上下调整 1 分，检查排序</text></g></a><a href="/docs/use-case-prioritization/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">提交三个候选场景的评分和证据，写出首期纳</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>