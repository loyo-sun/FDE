<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">产品反馈与需求抽象章节图解</title><desc id="desc">将客户诉求还原为可复用问题 → 现场反馈卡 → 区分项目、配置与产品 → 与产品团队对齐 → 关闭反馈的标准 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">产品反馈与需求抽象</text><text x="30" y="80" font-size="16" fill="#b5dce0">区分单一客户定制和具有复用价值的产品需求。</text><a href="/docs/product-feedback/#%E5%B0%86%E5%AE%A2%E6%88%B7%E8%AF%89%E6%B1%82%E8%BF%98%E5%8E%9F%E4%B8%BA%E5%8F%AF%E5%A4%8D%E7%94%A8%E9%97%AE%E9%A2%98"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">将客户诉求还原为可复用问题</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">“给客户 A 加一个专用按钮”描述了实现</text></g></a><a href="/docs/product-feedback/#%E7%8E%B0%E5%9C%BA%E5%8F%8D%E9%A6%88%E5%8D%A1"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">现场反馈卡</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/product-feedback/#%E5%8C%BA%E5%88%86%E9%A1%B9%E7%9B%AE%E9%85%8D%E7%BD%AE%E4%B8%8E%E4%BA%A7%E5%93%81"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">区分项目、配置与产品</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">法规或合同独有流程可能保留为项目扩展；文</text></g></a><a href="/docs/product-feedback/#%E4%B8%8E%E4%BA%A7%E5%93%81%E5%9B%A2%E9%98%9F%E5%AF%B9%E9%BD%90"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">与产品团队对齐</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">提交问题证据、受影响人群、价值和不解决的</text></g></a><a href="/docs/product-feedback/#%E5%85%B3%E9%97%AD%E5%8F%8D%E9%A6%88%E7%9A%84%E6%A0%87%E5%87%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">关闭反馈的标准</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">状态可用“待取证、待决策、已排期、已交付</text></g></a><a href="/docs/product-feedback/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">把三个定制请求改写成问题卡，给出项目扩展</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>