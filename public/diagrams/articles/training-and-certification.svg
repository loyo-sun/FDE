<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">学习路线与能力评估章节图解</title><desc id="desc">用产出检验成长 → 阅读与实践 → 评审问题 → 继续深化 → 八周学习安排示例 → 评分方式 → 复核与补练</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">学习路线与能力评估</text><text x="30" y="80" font-size="16" fill="#b5dce0">用项目产出检验从入门到独立负责项目的成长。</text><a href="/docs/training-and-certification/#%E7%94%A8%E4%BA%A7%E5%87%BA%E6%A3%80%E9%AA%8C%E6%88%90%E9%95%BF"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">用产出检验成长</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">学习路线不绑定固定天数。已有工程经验的人</text></g></a><a href="/docs/training-and-certification/#%E9%98%85%E8%AF%BB%E4%B8%8E%E5%AE%9E%E8%B7%B5"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">阅读与实践</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">从FDE 学习路线选择路线。每完成一个主</text></g></a><a href="/docs/training-and-certification/#%E8%AF%84%E5%AE%A1%E9%97%AE%E9%A2%98"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">评审问题</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">能否指出问题来自哪些客户事实，哪些仍是假</text></g></a><a href="/docs/training-and-certification/#%E7%BB%A7%E7%BB%AD%E6%B7%B1%E5%8C%96"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">继续深化</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">本轮已提供合成项目、评分量表与练习数据；</text></g></a><a href="/docs/training-and-certification/#%E5%85%AB%E5%91%A8%E5%AD%A6%E4%B9%A0%E5%AE%89%E6%8E%92%E7%A4%BA%E4%BE%8B"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">八周学习安排示例</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">八周是可调整的教学安排，不是掌握全部知识</text></g></a><a href="/docs/training-and-certification/#%E8%AF%84%E5%88%86%E6%96%B9%E5%BC%8F"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">评分方式</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">对每个主题使用四档：0 无产出，1 能解</text></g></a><a href="/docs/training-and-certification/#%E5%A4%8D%E6%A0%B8%E4%B8%8E%E8%A1%A5%E7%BB%83"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">复核与补练</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">使用实战评分表进行跨领域评审。不能只用阅</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>