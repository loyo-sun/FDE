<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">AI 应用交付章节图解</title><desc id="desc">需求澄清 → 交付设计 → 上线门禁 → 灰度与回退 → 从实验到受控试点 → 版本包与发布记录 → 回退与降级的区别 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">AI 应用交付</text><text x="30" y="80" font-size="16" fill="#b5dce0">把业务需求转成可测试、可上线的 AI 方案。</text><a href="/docs/ai-delivery/#%E9%9C%80%E6%B1%82%E6%BE%84%E6%B8%85"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">需求澄清</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">先确定用户是谁、输入是什么、期望动作是什</text></g></a><a href="/docs/ai-delivery/#%E4%BA%A4%E4%BB%98%E8%AE%BE%E8%AE%A1"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">交付设计</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">建立基线测试集和现状指标。</text></g></a><a href="/docs/ai-delivery/#%E4%B8%8A%E7%BA%BF%E9%97%A8%E7%A6%81"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">上线门禁</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">关键测试集达到约定指标。</text></g></a><a href="/docs/ai-delivery/#%E7%81%B0%E5%BA%A6%E4%B8%8E%E5%9B%9E%E9%80%80"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">灰度与回退</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">先面向内部用户或低风险流量灰度。回退对象</text></g></a><a href="/docs/ai-delivery/#%E4%BB%8E%E5%AE%9E%E9%AA%8C%E5%88%B0%E5%8F%97%E6%8E%A7%E8%AF%95%E7%82%B9"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">从实验到受控试点</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/ai-delivery/#%E7%89%88%E6%9C%AC%E5%8C%85%E4%B8%8E%E5%8F%91%E5%B8%83%E8%AE%B0%E5%BD%95"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">版本包与发布记录</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">记录应用提交、模型标识、提示词哈希、检索</text></g></a><a href="/docs/ai-delivery/#%E5%9B%9E%E9%80%80%E4%B8%8E%E9%99%8D%E7%BA%A7%E7%9A%84%E5%8C%BA%E5%88%AB"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">回退与降级的区别</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">回退切换到经过验证的旧版本；降级保留部分</text></g></a><a href="/docs/ai-delivery/#%E7%BB%83%E4%B9%A0"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">练习</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">为工单助手设计影子运行、试点准入和停止条</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>