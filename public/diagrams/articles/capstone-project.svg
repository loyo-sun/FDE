<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">端到端实战项目章节图解</title><desc id="desc">实战目标与边界 → 六个里程碑与产出 → 可下载的练习起点 → 评审与计分 → 进阶任务</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">端到端实战项目</text><text x="30" y="80" font-size="16" fill="#b5dce0">从问题访谈到上线复盘，完成一个可评审的示范项目。</text><a href="/docs/capstone-project/#%E5%AE%9E%E6%88%98%E7%9B%AE%E6%A0%87%E4%B8%8E%E8%BE%B9%E7%95%8C"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">实战目标与边界</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">完成一个企业售后工单助手的项目设计与验证</text></g></a><a href="/docs/capstone-project/#%E5%85%AD%E4%B8%AA%E9%87%8C%E7%A8%8B%E7%A2%91%E4%B8%8E%E4%BA%A7%E5%87%BA"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">六个里程碑与产出</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/capstone-project/#%E5%8F%AF%E4%B8%8B%E8%BD%BD%E7%9A%84%E7%BB%83%E4%B9%A0%E8%B5%B7%E7%82%B9"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">可下载的练习起点</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">合成工单与资料：包括两个租户、版本与受限</text></g></a><a href="/docs/capstone-project/#%E8%AF%84%E5%AE%A1%E4%B8%8E%E8%AE%A1%E5%88%86"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">评审与计分</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">这是学习评分建议，不是职业认证。安全关键</text></g></a><a href="/docs/capstone-project/#%E8%BF%9B%E9%98%B6%E4%BB%BB%E5%8A%A1"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">进阶任务</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">接入真实身份和持久化服务后重测资源授权；</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>