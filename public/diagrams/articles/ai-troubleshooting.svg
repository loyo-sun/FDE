<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">AI 系统常见故障章节图解</title><desc id="desc">回答错误或幻觉 → 知识没有召回 → Agent 工具失败 → 延迟突然升高 → 成本异常 → 不要同时修改所有变量 → 合成案例：回答引用旧版本 → 恢复后的验证 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">AI 系统常见故障</text><text x="30" y="80" font-size="16" fill="#b5dce0">诊断召回、输出、工具调用、性能和成本异常。</text><a href="/docs/ai-troubleshooting/#%E5%9B%9E%E7%AD%94%E9%94%99%E8%AF%AF%E6%88%96%E5%B9%BB%E8%A7%89"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">回答错误或幻觉</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">依次检查问题定义、系统提示、召回证据、上</text></g></a><a href="/docs/ai-troubleshooting/#%E7%9F%A5%E8%AF%86%E6%B2%A1%E6%9C%89%E5%8F%AC%E5%9B%9E"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">知识没有召回</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">文档是否成功解析并进入当前索引。</text></g></a><a href="/docs/ai-troubleshooting/#agent-%E5%B7%A5%E5%85%B7%E5%A4%B1%E8%B4%A5"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">Agent 工具失败</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">核对工具描述、参数 Schema、鉴权、</text></g></a><a href="/docs/ai-troubleshooting/#%E5%BB%B6%E8%BF%9F%E7%AA%81%E7%84%B6%E5%8D%87%E9%AB%98"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">延迟突然升高</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">拆分记录检索、重排、模型首字、模型生成和</text></g></a><a href="/docs/ai-troubleshooting/#%E6%88%90%E6%9C%AC%E5%BC%82%E5%B8%B8"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">成本异常</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">检查长会话历史、重复上下文、无效重试、大</text></g></a><a href="/docs/ai-troubleshooting/#%E4%B8%8D%E8%A6%81%E5%90%8C%E6%97%B6%E4%BF%AE%E6%94%B9%E6%89%80%E6%9C%89%E5%8F%98%E9%87%8F"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">不要同时修改所有变量</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/ai-troubleshooting/#%E5%90%88%E6%88%90%E6%A1%88%E4%BE%8B%E5%9B%9E%E7%AD%94%E5%BC%95%E7%94%A8%E6%97%A7%E7%89%88%E6%9C%AC"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">合成案例：回答引用旧版本</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">先读取这次任务使用的索引和过滤条件，再检</text></g></a><a href="/docs/ai-troubleshooting/#%E6%81%A2%E5%A4%8D%E5%90%8E%E7%9A%84%E9%AA%8C%E8%AF%81"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">恢复后的验证</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">重跑原失败样本、相邻版本问题和跨租户反例</text></g></a><a href="/docs/ai-troubleshooting/#%E7%BB%83%E4%B9%A0"><g><rect x="650" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="417" font-size="13" fill="#147c87">PART 09</text><text x="666" y="444" font-size="18" fill="#14384a">练习</text><text x="666" y="466" font-size="18" fill="#14384a"></text><text x="666" y="490" font-size="12" fill="#536c78">设计一次缓存失效和一次模型超时，写出定位</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>