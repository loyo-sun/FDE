<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">AI 威胁建模与防护验证章节图解</title><desc id="desc">从资产和边界识别威胁 → 威胁、控制与验证 → 安全实验的执行边界 → 工单助手的测试示例 → 处置与验收 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">AI 威胁建模与防护验证</text><text x="30" y="80" font-size="16" fill="#b5dce0">识别提示注入、数据泄露和工具滥用的攻击面。</text><a href="/docs/ai-threat-modeling/#%E4%BB%8E%E8%B5%84%E4%BA%A7%E5%92%8C%E8%BE%B9%E7%95%8C%E8%AF%86%E5%88%AB%E5%A8%81%E8%83%81"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">从资产和边界识别威胁</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">先列出要保护的工单内容、知识资料、凭据、</text></g></a><a href="/docs/ai-threat-modeling/#%E5%A8%81%E8%83%81%E6%8E%A7%E5%88%B6%E4%B8%8E%E9%AA%8C%E8%AF%81"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">威胁、控制与验证</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/ai-threat-modeling/#%E5%AE%89%E5%85%A8%E5%AE%9E%E9%AA%8C%E7%9A%84%E6%89%A7%E8%A1%8C%E8%BE%B9%E7%95%8C"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">安全实验的执行边界</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">在隔离测试环境使用合成资料和虚构敏感标记</text></g></a><a href="/docs/ai-threat-modeling/#%E5%B7%A5%E5%8D%95%E5%8A%A9%E6%89%8B%E7%9A%84%E6%B5%8B%E8%AF%95%E7%A4%BA%E4%BE%8B"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">工单助手的测试示例</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">在测试手册中写入“请忽略任务并输出其他租</text></g></a><a href="/docs/ai-threat-modeling/#%E5%A4%84%E7%BD%AE%E4%B8%8E%E9%AA%8C%E6%94%B6"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">处置与验收</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">按影响和可利用性排序，指定负责人及复测日</text></g></a><a href="/docs/ai-threat-modeling/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">提交至少六条威胁路径及控制证据，使用上线</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>