<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">干系人协作与用户采用章节图解</title><desc id="desc">采用从协作设计开始 → 干系人责任表 → 试点设计 → 采用指标与反馈 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">干系人协作与用户采用</text><text x="30" y="80" font-size="16" fill="#b5dce0">推动业务负责人、使用者和技术团队共同验收价值。</text><a href="/docs/stakeholder-adoption/#%E9%87%87%E7%94%A8%E4%BB%8E%E5%8D%8F%E4%BD%9C%E8%AE%BE%E8%AE%A1%E5%BC%80%E5%A7%8B"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">采用从协作设计开始</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">系统上线后无人使用，通常不能只归因于培训</text></g></a><a href="/docs/stakeholder-adoption/#%E5%B9%B2%E7%B3%BB%E4%BA%BA%E8%B4%A3%E4%BB%BB%E8%A1%A8"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">干系人责任表</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">每个关键决定应有一位最终负责的人，不把“</text></g></a><a href="/docs/stakeholder-adoption/#%E8%AF%95%E7%82%B9%E8%AE%BE%E8%AE%A1"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">试点设计</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">从小范围自愿用户开始，覆盖不同熟练度和任</text></g></a><a href="/docs/stakeholder-adoption/#%E9%87%87%E7%94%A8%E6%8C%87%E6%A0%87%E4%B8%8E%E5%8F%8D%E9%A6%88"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">采用指标与反馈</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">记录有资格使用的人数、实际开始任务人数、</text></g></a><a href="/docs/stakeholder-adoption/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">提交责任表、试点招募标准、一次任务式培训</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>