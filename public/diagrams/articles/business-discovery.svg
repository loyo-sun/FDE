<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">客户访谈与问题定义章节图解</title><desc id="desc">从解决方案诉求退回业务事实 → 访谈如何执行 → 可以直接使用的提问表 → 贯穿案例的一页问题定义 → 事实与假设的分离 → 练习与评审</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">客户访谈与问题定义</text><text x="30" y="80" font-size="16" fill="#b5dce0">把模糊诉求拆成用户、场景、问题与约束。</text><a href="/docs/business-discovery/#%E4%BB%8E%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88%E8%AF%89%E6%B1%82%E9%80%80%E5%9B%9E%E4%B8%9A%E5%8A%A1%E4%BA%8B%E5%AE%9E"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">从解决方案诉求退回业务事实</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">“做一个 AI 客服”是方案意向，尚不是</text></g></a><a href="/docs/business-discovery/#%E8%AE%BF%E8%B0%88%E5%A6%82%E4%BD%95%E6%89%A7%E8%A1%8C"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">访谈如何执行</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">分别接触业务负责人、一线使用者和系统管理</text></g></a><a href="/docs/business-discovery/#%E5%8F%AF%E4%BB%A5%E7%9B%B4%E6%8E%A5%E4%BD%BF%E7%94%A8%E7%9A%84%E6%8F%90%E9%97%AE%E8%A1%A8"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">可以直接使用的提问表</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/business-discovery/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E4%B8%80%E9%A1%B5%E9%97%AE%E9%A2%98%E5%AE%9A%E4%B9%89"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">贯穿案例的一页问题定义</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">以下为合成案例的待验证假设，不是访谈实测</text></g></a><a href="/docs/business-discovery/#%E4%BA%8B%E5%AE%9E%E4%B8%8E%E5%81%87%E8%AE%BE%E7%9A%84%E5%88%86%E7%A6%BB"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">事实与假设的分离</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/business-discovery/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E8%AF%84%E5%AE%A1"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与评审</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">使用问题定义模板，写出用户、任务、障碍、</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>