<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">测试、代码审查与持续集成章节图解</title><desc id="desc">质量检查围绕业务风险 → 最小验证矩阵 → 持续集成的门禁 → 代码审查的问题 → 失败用例与回归 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">测试、代码审查与持续集成</text><text x="30" y="80" font-size="16" fill="#b5dce0">用自动检查与评审控制变更质量。</text><a href="/docs/engineering-quality/#%E8%B4%A8%E9%87%8F%E6%A3%80%E6%9F%A5%E5%9B%B4%E7%BB%95%E4%B8%9A%E5%8A%A1%E9%A3%8E%E9%99%A9"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">质量检查围绕业务风险</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">测试应验证可观察行为，而不只是复述函数内</text></g></a><a href="/docs/engineering-quality/#%E6%9C%80%E5%B0%8F%E9%AA%8C%E8%AF%81%E7%9F%A9%E9%98%B5"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">最小验证矩阵</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/engineering-quality/#%E6%8C%81%E7%BB%AD%E9%9B%86%E6%88%90%E7%9A%84%E9%97%A8%E7%A6%81"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">持续集成的门禁</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">每次变更执行依赖安装、类型检查、核心业务</text></g></a><a href="/docs/engineering-quality/#%E4%BB%A3%E7%A0%81%E5%AE%A1%E6%9F%A5%E7%9A%84%E9%97%AE%E9%A2%98"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">代码审查的问题</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">改动解决了哪个用户问题？权限在哪一层执行</text></g></a><a href="/docs/engineering-quality/#%E5%A4%B1%E8%B4%A5%E7%94%A8%E4%BE%8B%E4%B8%8E%E5%9B%9E%E5%BD%92"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">失败用例与回归</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">为已发生的业务缺陷增加能触发原问题的用例</text></g></a><a href="/docs/engineering-quality/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">故意移除一处租户检查，确认至少一个权限用</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>