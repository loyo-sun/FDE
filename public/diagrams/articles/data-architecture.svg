<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">数据建模与业务语义章节图解</title><desc id="desc">先统一业务语义 → 贯穿案例的最小模型 → 状态与事件 → 数据质量检查 → 模型变化与迁移 → 练习与评审</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">数据建模与业务语义</text><text x="30" y="80" font-size="16" fill="#b5dce0">把业务对象、关系、事件和指标映射到可用的数据模型。</text><a href="/docs/data-architecture/#%E5%85%88%E7%BB%9F%E4%B8%80%E4%B8%9A%E5%8A%A1%E8%AF%AD%E4%B9%89"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">先统一业务语义</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">同一个“已完成”可能指回复已生成、工程师</text></g></a><a href="/docs/data-architecture/#%E8%B4%AF%E7%A9%BF%E6%A1%88%E4%BE%8B%E7%9A%84%E6%9C%80%E5%B0%8F%E6%A8%A1%E5%9E%8B"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">贯穿案例的最小模型</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">多租户系统中，关联查询同样必须校验租户；</text></g></a><a href="/docs/data-architecture/#%E7%8A%B6%E6%80%81%E4%B8%8E%E4%BA%8B%E4%BB%B6"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">状态与事件</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">工单状态与草稿状态分开。草稿可经历“生成</text></g></a><a href="/docs/data-architecture/#%E6%95%B0%E6%8D%AE%E8%B4%A8%E9%87%8F%E6%A3%80%E6%9F%A5"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">数据质量检查</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">入口检查必填、类型、唯一性、引用存在与业</text></g></a><a href="/docs/data-architecture/#%E6%A8%A1%E5%9E%8B%E5%8F%98%E5%8C%96%E4%B8%8E%E8%BF%81%E7%A7%BB"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">模型变化与迁移</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">新增字段先允许旧版本继续读取，回填并验证</text></g></a><a href="/docs/data-architecture/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E8%AF%84%E5%AE%A1"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">练习与评审</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">提交实体关系表、状态转移表和五条不变量，</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>