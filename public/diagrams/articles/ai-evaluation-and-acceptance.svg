<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">AI 评测与验收章节图解</title><desc id="desc">测试集建设 → 质量指标 → 验收方式 → 版本回归 → 样本结构与评分规则 → 人工评分的一致性 → 教学种子集与生产验收 → 发布结论</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">AI 评测与验收</text><text x="30" y="80" font-size="16" fill="#b5dce0">定义评测集、业务指标、失败门槛与上线标准。</text><a href="/docs/ai-evaluation-and-acceptance/#%E6%B5%8B%E8%AF%95%E9%9B%86%E5%BB%BA%E8%AE%BE"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">测试集建设</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">测试集来自真实业务问题、历史工单、专家设</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E8%B4%A8%E9%87%8F%E6%8C%87%E6%A0%87"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">质量指标</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">检索：命中率、召回率、首条相关率和权限过</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E9%AA%8C%E6%94%B6%E6%96%B9%E5%BC%8F"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">验收方式</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">自动评测适合持续回归，专家人工评测负责高</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E7%89%88%E6%9C%AC%E5%9B%9E%E5%BD%92"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">版本回归</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">模型、Prompt、检索策略、文档和工具</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E6%A0%B7%E6%9C%AC%E7%BB%93%E6%9E%84%E4%B8%8E%E8%AF%84%E5%88%86%E8%A7%84%E5%88%99"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">样本结构与评分规则</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">每条样本包含编号、任务、身份范围、资料版</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E4%BA%BA%E5%B7%A5%E8%AF%84%E5%88%86%E7%9A%84%E4%B8%80%E8%87%B4%E6%80%A7"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">人工评分的一致性</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">先用少量任务让两位评分人独立评分，讨论分</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E6%95%99%E5%AD%A6%E7%A7%8D%E5%AD%90%E9%9B%86%E4%B8%8E%E7%94%9F%E4%BA%A7%E9%AA%8C%E6%94%B6"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">教学种子集与生产验收</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/ai-evaluation-and-acceptance/#%E5%8F%91%E5%B8%83%E7%BB%93%E8%AE%BA"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">发布结论</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">报告样本量、版本组合、分层结果、失败案例</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>