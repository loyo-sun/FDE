<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">可观测性与服务目标章节图解</title><desc id="desc">从用户任务定义服务目标 → 信号与定位 → 示例 SLI、SLO 与预算 → 告警与行动 → 练习与完成标准</desc><rect width="960" height="440" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">可观测性与服务目标</text><text x="30" y="80" font-size="16" fill="#b5dce0">用日志、指标、链路和 SLO 发现用户受到的影响。</text><a href="/docs/observability/#%E4%BB%8E%E7%94%A8%E6%88%B7%E4%BB%BB%E5%8A%A1%E5%AE%9A%E4%B9%89%E6%9C%8D%E5%8A%A1%E7%9B%AE%E6%A0%87"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">从用户任务定义服务目标</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">服务进程存活不代表用户能够得到可用草稿。</text></g></a><a href="/docs/observability/#%E4%BF%A1%E5%8F%B7%E4%B8%8E%E5%AE%9A%E4%BD%8D"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">信号与定位</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">指标标签使用受控枚举，避免每个工单和用户</text></g></a><a href="/docs/observability/#%E7%A4%BA%E4%BE%8B-slislo-%E4%B8%8E%E9%A2%84%E7%AE%97"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">示例 SLI、SLO 与预算</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">以下是合成设计，不是生产承诺。SLI =</text></g></a><a href="/docs/observability/#%E5%91%8A%E8%AD%A6%E4%B8%8E%E8%A1%8C%E5%8A%A8"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">告警与行动</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">告警应包含用户影响、当前值、观察窗口、追</text></g></a><a href="/docs/observability/#%E7%BB%83%E4%B9%A0%E4%B8%8E%E5%AE%8C%E6%88%90%E6%A0%87%E5%87%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">练习与完成标准</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">注入一次检索延迟和一次模型故障，确认能从</text></g></a><text x="30" y="422" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>