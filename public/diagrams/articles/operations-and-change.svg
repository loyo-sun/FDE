<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">运维、监控与变更章节图解</title><desc id="desc">监控分层 → 告警要求 → 备份与恢复 → 变更管理 → 容量管理 → 日常运行节奏 → RPO / RTO 示例 → 变更关闭条件 → 练习</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">运维、监控与变更</text><text x="30" y="80" font-size="16" fill="#b5dce0">管理版本、容量、备份、回退和日常运维。</text><a href="/docs/operations-and-change/#%E7%9B%91%E6%8E%A7%E5%88%86%E5%B1%82"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">监控分层</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">基础设施：CPU、内存、磁盘、网络和时间</text></g></a><a href="/docs/operations-and-change/#%E5%91%8A%E8%AD%A6%E8%A6%81%E6%B1%82"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">告警要求</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">告警必须可行动，包含环境、对象、影响、当</text></g></a><a href="/docs/operations-and-change/#%E5%A4%87%E4%BB%BD%E4%B8%8E%E6%81%A2%E5%A4%8D"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">备份与恢复</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">备份成功不代表可恢复。明确 RPO、RT</text></g></a><a href="/docs/operations-and-change/#%E5%8F%98%E6%9B%B4%E7%AE%A1%E7%90%86"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">变更管理</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">记录目的、范围、风险、实施步骤、验证、回</text></g></a><a href="/docs/operations-and-change/#%E5%AE%B9%E9%87%8F%E7%AE%A1%E7%90%86"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">容量管理</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">基于业务增长、峰值并发和资源水位建立趋势</text></g></a><a href="/docs/operations-and-change/#%E6%97%A5%E5%B8%B8%E8%BF%90%E8%A1%8C%E8%8A%82%E5%A5%8F"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">日常运行节奏</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">频率需要按系统风险与团队能力调整。备份应</text></g></a><a href="/docs/operations-and-change/#rpo--rto-%E7%A4%BA%E4%BE%8B"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">RPO / RTO 示例</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">RPO 表示可接受的数据丢失窗口，RTO</text></g></a><a href="/docs/operations-and-change/#%E5%8F%98%E6%9B%B4%E5%85%B3%E9%97%AD%E6%9D%A1%E4%BB%B6"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">变更关闭条件</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">发布完成后观察用户任务、错误、延迟、成本</text></g></a><a href="/docs/operations-and-change/#%E7%BB%83%E4%B9%A0"><g><rect x="650" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="417" font-size="13" fill="#147c87">PART 09</text><text x="666" y="444" font-size="18" fill="#14384a">练习</text><text x="666" y="466" font-size="18" fill="#14384a"></text><text x="666" y="490" font-size="12" fill="#536c78">用上线检查设计索引升级，演练失败恢复，并</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>