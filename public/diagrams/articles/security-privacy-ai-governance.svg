<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">安全、隐私与 AI 治理章节图解</title><desc id="desc">基础安全 → 数据分级 → AI 特有风险 → 防护原则 → 审计 → 将风险治理落到项目责任 → 首期工单助手的治理决定 → 验证与例外</desc><rect width="960" height="570" rx="18" fill="#edf5f5"/><path d="M0 0 H960 V106 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="30" y="48" font-size="28" fill="#fff">安全、隐私与 AI 治理</text><text x="30" y="80" font-size="16" fill="#b5dce0">理解项目中的安全控制与治理责任。</text><a href="/docs/security-privacy-ai-governance/#%E5%9F%BA%E7%A1%80%E5%AE%89%E5%85%A8"><g><rect x="30" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="157" font-size="13" fill="#147c87">PART 01</text><text x="46" y="184" font-size="18" fill="#14384a">基础安全</text><text x="46" y="206" font-size="18" fill="#14384a"></text><text x="46" y="230" font-size="12" fill="#536c78">使用最小权限、独立账号、短期凭据和多因素</text></g></a><a href="/docs/security-privacy-ai-governance/#%E6%95%B0%E6%8D%AE%E5%88%86%E7%BA%A7"><g><rect x="340" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="157" font-size="13" fill="#147c87">PART 02</text><text x="356" y="184" font-size="18" fill="#14384a">数据分级</text><text x="356" y="206" font-size="18" fill="#14384a"></text><text x="356" y="230" font-size="12" fill="#536c78">在接入客户资料前确认数据级别、用途、存储</text></g></a><a href="/docs/security-privacy-ai-governance/#ai-%E7%89%B9%E6%9C%89%E9%A3%8E%E9%99%A9"><g><rect x="650" y="132" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="157" font-size="13" fill="#147c87">PART 03</text><text x="666" y="184" font-size="18" fill="#14384a">AI 特有风险</text><text x="666" y="206" font-size="18" fill="#14384a"></text><text x="666" y="230" font-size="12" fill="#536c78">Prompt 注入诱导模型忽略规则或泄露</text></g></a><a href="/docs/security-privacy-ai-governance/#%E9%98%B2%E6%8A%A4%E5%8E%9F%E5%88%99"><g><rect x="30" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="287" font-size="13" fill="#147c87">PART 04</text><text x="46" y="314" font-size="18" fill="#14384a">防护原则</text><text x="46" y="336" font-size="18" fill="#14384a"></text><text x="46" y="360" font-size="12" fill="#536c78">权限判断必须由确定性系统执行，不能交给模</text></g></a><a href="/docs/security-privacy-ai-governance/#%E5%AE%A1%E8%AE%A1"><g><rect x="340" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="287" font-size="13" fill="#147c87">PART 05</text><text x="356" y="314" font-size="18" fill="#14384a">审计</text><text x="356" y="336" font-size="18" fill="#14384a"></text><text x="356" y="360" font-size="12" fill="#536c78">保留用户、时间、输入摘要、检索文档、模型</text></g></a><a href="/docs/security-privacy-ai-governance/#%E5%B0%86%E9%A3%8E%E9%99%A9%E6%B2%BB%E7%90%86%E8%90%BD%E5%88%B0%E9%A1%B9%E7%9B%AE%E8%B4%A3%E4%BB%BB"><g><rect x="650" y="262" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="666" y="287" font-size="13" fill="#147c87">PART 06</text><text x="666" y="314" font-size="18" fill="#14384a">将风险治理落到项目责任</text><text x="666" y="336" font-size="18" fill="#14384a"></text><text x="666" y="360" font-size="12" fill="#536c78">方法、示例与验证要点</text></g></a><a href="/docs/security-privacy-ai-governance/#%E9%A6%96%E6%9C%9F%E5%B7%A5%E5%8D%95%E5%8A%A9%E6%89%8B%E7%9A%84%E6%B2%BB%E7%90%86%E5%86%B3%E5%AE%9A"><g><rect x="30" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="46" y="417" font-size="13" fill="#147c87">PART 07</text><text x="46" y="444" font-size="18" fill="#14384a">首期工单助手的治理决定</text><text x="46" y="466" font-size="18" fill="#14384a"></text><text x="46" y="490" font-size="12" fill="#536c78">只输出草稿，人工审核后通过既有渠道发送；</text></g></a><a href="/docs/security-privacy-ai-governance/#%E9%AA%8C%E8%AF%81%E4%B8%8E%E4%BE%8B%E5%A4%96"><g><rect x="340" y="392" width="290" height="112" rx="12" fill="#fff" stroke="#b9d4dc"/><text x="356" y="417" font-size="13" fill="#147c87">PART 08</text><text x="356" y="444" font-size="18" fill="#14384a">验证与例外</text><text x="356" y="466" font-size="18" fill="#14384a"></text><text x="356" y="490" font-size="12" fill="#536c78">建立威胁、控制、测试、残余风险的映射。某</text></g></a><text x="30" y="552" font-size="13" fill="#53717b">来源：FDE 知识库原创 · Codex 绘制 · 2026-10-14</text></g></svg>