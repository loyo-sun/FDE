<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">故障诊断与恢复闭环</title><desc id="desc">发现影响：用户、范围及开始时间 → 止损处置：降级、隔离或回退 → 还原时间线：发布、依赖及数据变化 → 验证假设：一次只改变一个变量 → 业务恢复：用户任务及数据一致性 → 复盘改进：负责人、期限及回归测试</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#eef5f8"/><path d="M0 0 H1000 V132 H0" fill="#102d40"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="58" fill="#fff" font-size="32" font-weight="700">故障诊断与恢复闭环</text><text x="48" y="98" fill="#b6d9e3" font-size="19">先控制影响，再用证据排除假设</text><path d="M328 230 H350" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 230 H662" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M812 290 V360" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M672 430 H650" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 430 H338" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="48" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="200" fill="#087e8b" font-size="15">STEP 01</text><text x="68" y="235" fill="#102d40" font-size="23" font-weight="600">发现影响</text><text x="68" y="266" fill="#4f6473" font-size="16">用户、范围及开始时间</text></g><g><rect x="360" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="200" fill="#087e8b" font-size="15">STEP 02</text><text x="380" y="235" fill="#102d40" font-size="23" font-weight="600">止损处置</text><text x="380" y="266" fill="#4f6473" font-size="16">降级、隔离或回退</text></g><g><rect x="672" y="170" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="200" fill="#087e8b" font-size="15">STEP 03</text><text x="692" y="235" fill="#102d40" font-size="23" font-weight="600">还原时间线</text><text x="692" y="266" fill="#4f6473" font-size="16">发布、依赖及数据变化</text></g><g><rect x="672" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="692" y="400" fill="#087e8b" font-size="15">STEP 04</text><text x="692" y="435" fill="#102d40" font-size="23" font-weight="600">验证假设</text><text x="692" y="466" fill="#4f6473" font-size="16">一次只改变一个变量</text></g><g><rect x="360" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="380" y="400" fill="#087e8b" font-size="15">STEP 05</text><text x="380" y="435" fill="#102d40" font-size="23" font-weight="600">业务恢复</text><text x="380" y="466" fill="#4f6473" font-size="16">用户任务及数据一致性</text></g><g><rect x="48" y="370" width="280" height="120" rx="16" fill="#fff" stroke="#c4d8e1"/><text x="68" y="400" fill="#087e8b" font-size="15">STEP 06</text><text x="68" y="435" fill="#102d40" font-size="23" font-weight="600">复盘改进</text><text x="68" y="466" fill="#4f6473" font-size="16">负责人、期限及回归测试</text></g><text x="48" y="540" fill="#536d7c" font-size="14">来源：fde.loyo.work</text></g></svg>